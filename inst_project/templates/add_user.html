<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fafafa;
      font-family: Arial, sans-serif;
      color: #262626;
    }

    .card {
      box-sizing: border-box;
      width: min(350px, calc(100% - 32px));
      padding: 32px;
      background: white;
      border: 1px solid #dbdbdb;
      text-align: center;
    }

    h1 { margin: 0 0 24px; 
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
    }

    input, button {
      box-sizing: border-box;
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font: inherit;
      border-radius: 4px;
    }

    input { border: 1px solid #dbdbdb; }

    button {
      margin-top: 14px;
      border: 0;
      background: #3867d6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .message { margin-top: 16px; }
    .note { color: #737373; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Instagram</h1>

    <form method="post">
      <input name="username" placeholder="Username" autocomplete="username" required>
      <input name="password" type="password" placeholder="Password"
             autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
<br>
    Forget Password <a href="{{ url_for('register') }}">Reset Password</a>
      <p class="message" role="status">OR</p>
    <a href="{{ url_for('register') }}">Create New Account</a>

  </main>
</body>
</html>
